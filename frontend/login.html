<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | RealtyKey AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f3f7ff,#f8fafc);color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.auth-wrap{width:min(430px,100%)}.brand{text-align:center;margin-bottom:18px}.brand img{width:58px;height:58px;object-fit:contain}.brand h1{font-size:30px;margin:8px 0 4px}.brand h1 span{color:#315efb}.brand p{color:#64748b;margin:0;font-size:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 25px 70px rgba(15,23,42,.10);padding:30px}.card h2{margin:0 0 8px}.sub{color:#64748b;font-size:14px;margin:0 0 22px}.group{margin:0 0 16px}.group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#334155}.group input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}.group input:focus{outline:none;border-color:#315efb;box-shadow:0 0 0 3px rgba(49,94,251,.10)}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#315efb;color:#fff;font-size:14px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.message{display:none;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:16px}.message.show{display:block}.message.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca}.message.success{background:#ecfdf3;color:#027a48;border:1px solid #a6f4c5}.links{text-align:center;margin-top:18px;font-size:13px;color:#64748b}.links a{color:#315efb;text-decoration:none;font-weight:700}.back{display:block;text-align:center;margin-top:14px;color:#64748b;text-decoration:none;font-size:12px}</style></head><body><div class="auth-wrap"><div class="brand"><img src="/assets/logo.jpeg" alt="RealtyKey AI"><h1>RealtyKey <span>AI</span></h1><p>AI-powered real estate intelligence</p></div><div class="card"><h2>Welcome back</h2><p class="sub">Login with your email address or mobile number.</p><div id="message" class="message"></div><form id="loginForm"><div class="group"><label for="identifier">Email or Mobile Number</label><input id="identifier" autocomplete="username" required placeholder="you@example.com or 10-digit mobile"></div><div class="group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></div><button class="submit" id="loginButton" type="submit">Login</button></form><div class="links">Don't have an account? <a href="signup.html">Create an account</a></div><a class="back" href="index.html">← Back to RealtyKey AI</a></div></div><script>const f=document.getElementById('loginForm'),b=document.getElementById('loginButton'),m=document.getElementById('message');function msg(t,c){m.textContent=t;m.className='message show '+c}f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Logging in...';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({identifier:document.getElementById('identifier').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success){msg(d.error||'Login failed.','error');return}msg('Login successful. Redirecting...','success');setTimeout(()=>location.href=new URLSearchParams(location.search).get('next')||'index.html',350)}catch(err){msg('Unable to connect to the RealtyKey AI server.','error')}finally{b.disabled=false;b.textContent='Login'}})</script></body></html>
