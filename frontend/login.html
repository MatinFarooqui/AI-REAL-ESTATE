<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to RealtyKey AI to manage property decisions, listings and conversations.">
    <title>Login | RealtyKey AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-wrap">
        <header class="brand">
            <img src="/assets/logo.jpeg" alt="RealtyKey AI">
            <h1>RealtyKey <span>AI</span></h1>
            <p>Smarter Property Decisions</p>
        </header>
        <section class="card" aria-labelledby="loginHeading">
            <h2 id="loginHeading">Welcome back</h2>
            <p class="sub">Login with your email address or mobile number.</p>
            <div id="message" class="message" aria-live="polite"></div>
            <form id="loginForm">
                <div class="group">
                    <label for="identifier">Email or Mobile Number</label>
                    <input id="identifier" autocomplete="username" required placeholder="you@example.com or 10-digit mobile">
                </div>
                <div class="group">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="current-password" required placeholder="Enter password">
                </div>
                <button class="submit" id="loginButton" type="submit">Login</button>
            </form>
            <div class="links">Don't have an account? <a href="signup.html">Create an account</a></div>
        </section>
        <a class="back" href="index.html">Back to RealtyKey AI</a>
    </main>
    <script>
        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, state) {
            message.textContent = text;
            message.className = `message show ${state}`;
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            button.disabled = true;
            button.textContent = "Logging in...";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        identifier: document.getElementById("identifier").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    showMessage(data.error || "Login failed.", "error");
                    return;
                }

                showMessage("Login successful. Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = new URLSearchParams(window.location.search).get("next") || "index.html";
                }, 350);
            } catch (error) {
                showMessage("Unable to connect to the RealtyKey AI server.", "error");
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>
</body>
</html>
