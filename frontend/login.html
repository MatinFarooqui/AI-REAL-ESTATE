<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HomeSense AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-size: 32px;
            color: #172554;
            margin-bottom: 7px;
        }

        .brand span {
            color: #2563eb;
        }

        .brand p {
            color: #64748b;
            font-size: 14px;
        }

        .auth-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
            border: 1px solid #e2e8f0;
        }

        .auth-card h2 {
            color: #172033;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px 12px;
            border-radius: 8px;
            margin-bottom: 17px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .bottom-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .bottom-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home a:hover {
            color: #2563eb;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 27px 22px;
            }

            .brand h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="brand">
            <h1>HomeSense <span>AI</span></h1>
            <p>AI-powered real estate intelligence</p>
        </div>

        <div class="auth-card">

            <h2>Welcome back</h2>
            <p class="subtitle">Login to continue to your HomeSense AI account.</p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

            </form>

            <div class="bottom-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </div>

            <div class="back-home">
                <a href="index.html">← Back to HomeSense AI</a>
            </div>

        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showMessage("Please enter your email and password.", "error");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";
            message.className = "message";

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showMessage(
                        data.error || "Login failed. Please try again.",
                        "error"
                    );

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                    return;
                }

                showMessage("Login successful. Redirecting...", "success");

                setTimeout(function () {
                    window.location.href = "index.html";
                }, 800);

            } catch (error) {

                console.error("Login error:", error);

                showMessage(
                    "Unable to connect to the HomeSense AI server.",
                    "error"
                );

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
