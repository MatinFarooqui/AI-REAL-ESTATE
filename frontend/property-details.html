<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details | RealtyKey AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;background:#f5f7fb;color:#172033}a{text-decoration:none;color:inherit}.navbar{height:74px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.brand{font:800 22px "Manrope",sans-serif}.brand span{color:#3157d5}.back-link{color:#667085;font-weight:600}.page{width:min(1200px,92%);margin:0 auto;padding:26px 0 60px}.breadcrumb{color:#98a2b3;font-size:13px;margin-bottom:20px}.property-layout{display:grid;grid-template-columns:1.25fr .85fr;gap:28px}.detail-gallery{background:#fff;border:1px solid #e6eaf1;border-radius:24px;padding:14px;box-shadow:0 14px 35px rgba(15,23,42,.05)}.detail-main-image{width:100%;height:520px;object-fit:cover;border-radius:16px;display:block;background:#eef2f7}.detail-thumbnails{display:flex;gap:10px;overflow:auto;padding:12px 2px 2px}.detail-thumb{width:82px;height:64px;flex:0 0 auto;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#eef2f7;cursor:pointer}.detail-thumb.active{border-color:#3157d5}.detail-thumb img{width:100%;height:100%;object-fit:cover}.no-images{padding:14px;color:#98a2b3}.detail-card,.detail-section{background:#fff;border:1px solid #e6eaf1;border-radius:24px;padding:28px;box-shadow:0 14px 35px rgba(15,23,42,.05)}.detail-topline{display:flex;gap:8px;align-items:center;margin-bottom:14px}.detail-badge,.user-listed-badge,.status-pill{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.detail-badge{background:#eef2ff;color:#3157d5}.user-listed-badge{background:#ecfdf3;color:#027a48}.detail-card h1{font:800 38px/1.15 "Manrope",sans-serif;margin-bottom:8px}.detail-location{color:#667085;margin-bottom:20px}.detail-price{font:800 32px "Manrope",sans-serif;margin-bottom:22px}.detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.detail-stats div,.detail-feature-grid div{background:#f7f8fb;border-radius:14px;padding:15px}.detail-stats small,.detail-feature-grid small{display:block;color:#98a2b3;font-size:11px;margin-bottom:5px}.detail-stats strong,.detail-feature-grid strong{font-weight:700}.detail-ai{background:#101828;color:#fff;border-radius:18px;padding:18px;margin-bottom:18px}.detail-ai small{color:#aab4c5;font-size:11px}.detail-ai strong{display:block;font:800 30px "Manrope",sans-serif;margin:4px 0}.detail-ai p{color:#c7cfdb;font-size:13px;line-height:1.6}.detail-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.primary-button,.secondary-button,.report-button,.danger-button{border-radius:11px;padding:12px 16px;font-weight:700;border:1px solid transparent;cursor:pointer;font:700 13px "DM Sans",sans-serif}.primary-button{background:#3157d5;color:#fff}.secondary-button{background:#fff;border-color:#dfe5ec;color:#344054}.report-button{background:#fff7f6;border-color:#ffd5d2;color:#b42318}.danger-button{background:#fff1f0;border-color:#f7c7c2;color:#b42318}.owner-note{font-size:13px;font-weight:700;color:#027a48}.detail-section{margin-top:24px}.detail-section .section-label{display:block;color:#3157d5;font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:9px}.detail-section h2{font:800 24px "Manrope",sans-serif;margin-bottom:10px}.detail-section>p{color:#667085;line-height:1.8}.detail-feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.overlay-modal{position:fixed;inset:0;background:rgba(16,24,40,.56);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.overlay-modal.active{display:flex}.overlay-modal-card{width:min(620px,100%);background:#fff;border-radius:22px;padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.2)}.modal-x{position:absolute;right:15px;top:12px;border:0;background:transparent;font-size:28px;color:#98a2b3;cursor:pointer}.overlay-modal-card h2{font:800 24px "Manrope",sans-serif;margin:8px 0 18px}.quick-messages{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.quick-messages button{border:1px solid #dfe5ec;background:#f8fafc;border-radius:999px;padding:9px 12px;cursor:pointer;color:#344054;font-size:12px;font-weight:600}.chat-compose{display:flex;gap:8px}.chat-compose input,.overlay-modal-card select,.overlay-modal-card textarea{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:12px;font:500 14px "DM Sans",sans-serif}.chat-compose button{border:0;background:#3157d5;color:#fff;border-radius:11px;padding:0 18px;font-weight:700;cursor:pointer}.overlay-modal-card label{display:block;font-weight:700;color:#344054;font-size:13px;margin-bottom:14px}.overlay-modal-card label input,.overlay-modal-card label select,.overlay-modal-card label textarea{margin-top:7px}.chat-status{font-size:13px;color:#475467;margin-top:10px}.details-error{background:#fff;border:1px solid #e6eaf1;border-radius:22px;padding:40px;text-align:center}.details-error h1{font:800 28px "Manrope",sans-serif;margin-bottom:8px}.details-error p{color:#667085}
        @media(max-width:900px){.property-layout{grid-template-columns:1fr}.detail-main-image{height:400px}.detail-feature-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:600px){.navbar{padding:0 4%;height:66px}.brand{font-size:19px}.page{width:94%;padding-top:18px}.detail-gallery,.detail-card,.detail-section{border-radius:18px;padding:18px}.detail-main-image{height:300px}.detail-card h1{font-size:29px}.detail-price{font-size:27px}.detail-stats{grid-template-columns:1fr 1fr}.detail-feature-grid{grid-template-columns:1fr}.detail-actions{display:grid;grid-template-columns:1fr}.detail-actions>*{width:100%;text-align:center}.chat-compose{flex-direction:column}.chat-compose button{height:44px}.overlay-modal-card{padding:22px 18px}}
