<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a RealtyKey AI account to discover and manage property listings.">
    <title>Create Account | RealtyKey AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-wrap">
        <header class="brand">
            <img src="/assets/logo.jpeg" alt="RealtyKey AI">
            <h1>RealtyKey <span>AI</span></h1>
            <p>Smarter Property Decisions</p>
        </header>
        <section class="card" aria-labelledby="signupHeading">
            <h2 id="signupHeading">Create your account</h2>
            <p class="sub">Email is required for your account. Email verification is not used.</p>
            <div id="message" class="message" aria-live="polite"></div>
            <form id="signupForm">
                <div class="group">
                    <label for="name">Full Name</label>
                    <input id="name" autocomplete="name" required placeholder="Enter your full name">
                </div>
                <div class="group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
                </div>
                <div class="group">
                    <label for="phone">Mobile Number <span>(optional)</span></label>
                    <input id="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="10-digit mobile number">
                </div>
                <div class="group">
                    <label for="password">Password</label>
                    <input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Minimum 6 characters">
                </div>
                <button class="submit" id="signupButton" type="submit">Create Account</button>
            </form>
            <div class="links">Already have an account? <a href="login.html">Login</a></div>
        </section>
        <a class="back" href="index.html">Back to RealtyKey AI</a>
    </main>
    <script>
        const form = document.getElementById("signupForm");
        const button = document.getElementById("signupButton");
        const message = document.getElementById("message");

        function showMessage(text, state) {
            message.textContent = text;
            message.className = `message show ${state}`;
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();
            button.disabled = true;
            button.textContent = "Creating Account...";

            try {
                const response = await fetch("/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        email: document.getElementById("email").value.trim(),
                        phone: document.getElementById("phone").value.trim(),
                        password: document.getElementById("password").value
                    })
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    showMessage(data.error || "Unable to create account.", "error");
                    return;
                }

                showMessage("Account created successfully. You can now log in.", "success");
                form.reset();
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 900);
            } catch (error) {
                showMessage("Unable to connect to the RealtyKey AI server.", "error");
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
