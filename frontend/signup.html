<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | RealtyKey AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f3f7ff,#f8fafc);color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.auth-wrap{width:min(430px,100%)}.brand{text-align:center;margin-bottom:18px}.brand img{width:58px;height:58px;object-fit:contain}.brand h1{font-size:30px;margin:8px 0 4px}.brand h1 span{color:#315efb}.brand p{color:#64748b;margin:0;font-size:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 25px 70px rgba(15,23,42,.10);padding:30px}.card h2{margin:0 0 8px}.sub{color:#64748b;font-size:14px;margin:0 0 22px}.group{margin:0 0 16px}.group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#334155}.group input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}.group input:focus{outline:none;border-color:#315efb;box-shadow:0 0 0 3px rgba(49,94,251,.10)}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#315efb;color:#fff;font-size:14px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.message{display:none;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:16px}.message.show{display:block}.message.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca}.message.success{background:#ecfdf3;color:#027a48;border:1px solid #a6f4c5}.links{text-align:center;margin-top:18px;font-size:13px;color:#64748b}.links a{color:#315efb;text-decoration:none;font-weight:700}.back{display:block;text-align:center;margin-top:14px;color:#64748b;text-decoration:none;font-size:12px}</style></head><body><div class="auth-wrap"><div class="brand"><img src="/assets/logo.jpeg" alt="RealtyKey AI"><h1>RealtyKey <span>AI</span></h1><p>AI-powered real estate intelligence</p></div><div class="card"><h2>Create your account</h2><p class="sub">Email is required for your account. Email verification is not used.</p><div id="message" class="message"></div><form id="signupForm"><div class="group"><label for="name">Full Name</label><input id="name" autocomplete="name" required placeholder="Enter your full name"></div><div class="group"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="group"><label for="phone">Mobile Number <span style="color:#94a3b8;font-weight:400">(optional)</span></label><input id="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="10-digit mobile number"></div><div class="group"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Minimum 6 characters"></div><button class="submit" id="signupButton" type="submit">Create Account</button></form><div class="links">Already have an account? <a href="login.html">Login</a></div><a class="back" href="index.html">← Back to RealtyKey AI</a></div></div><script>const f=document.getElementById('signupForm'),b=document.getElementById('signupButton'),m=document.getElementById('message');function msg(t,c){m.textContent=t;m.className='message show '+c}f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Creating Account...';try{const r=await fetch('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success){msg(d.error||'Unable to create account.','error');return}msg('Account created successfully. You can now log in.','success');f.reset();setTimeout(()=>location.href='login.html','900')}catch(err){msg('Unable to connect to the RealtyKey AI server.','error')}finally{b.disabled=false;b.textContent='Create Account'}})</script></body></html>
